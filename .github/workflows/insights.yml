name: insights
on:
  schedule:
    - cron: "41 4 * * 1"      # Mondays 10:11 IST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841475226001074"
        run: python3 scripts/insights.py
      - run: |
          git config user.name "sayless-bot"; git config user.email "sayless-bot@users.noreply.github.com"
          git add insights; git diff --cached --quiet || (git commit -m "insights snapshot" && git push)
